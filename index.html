<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0757c8" />
  <meta name="description" content="Optero — van opdracht naar planning, uitvoering en onderhoud." />
  <title>Optero</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
</head>
<body>
  <div id="authRoot"></div>

  <div class="app-shell" id="appShell" hidden>
    <header class="topbar">
      <button class="icon-btn" id="backBtn" aria-label="Terug" hidden>←</button>
      <div class="topbar-title">
        <p class="eyebrow">Optero</p>
        <h1 id="pageTitle">Dashboard</h1>
      </div>
      <div class="topbar-actions">
        <button class="sync-status" id="syncStatus" data-state="loading" type="button" aria-live="polite" title="Cloudgegevens laden"><span aria-hidden="true">◌</span><span class="sync-status-label">Cloud laden…</span></button>
        <button class="icon-btn" id="notifyBtn" aria-label="Open onderhoudsactielijst">🔔</button>
        <button class="account-btn" id="accountBtn" aria-label="Open bedrijfsaccount">OP</button>
      </div>
    </header>

    <main id="app"></main>
    <button id="fabAdd" class="fab-add" aria-label="Nieuwe installatie toevoegen">+</button>

    <nav class="bottom-nav" aria-label="Hoofdnavigatie">
      <button data-route="dashboard" class="active">⌂<span>Home</span></button>
      <button data-route="customers">👥<span>Klanten</span></button>
      <button data-route="agenda">📅<span>Planning</span></button>
      <button data-route="more">•••<span>Meer</span></button>
    </nav>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
